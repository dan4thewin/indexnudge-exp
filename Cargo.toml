[package]
name = "codeindex"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
rusqlite = { version = "0.39.0", features = ["bundled"] }
syn = { version = "2.0.117", features = ["full", "parsing", "visit"] }
walkdir = "2.5.0"
